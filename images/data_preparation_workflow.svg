<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1330" viewBox="0 0 920 510" role="img">
  <title>From source data to an analysis-ready inventory</title>
  <desc>Tree inventory, infrastructure context, and equity context move through attribute standardization, DBH preparation, and simulated planning variables to form a traceable analysis-ready tree dataset.</desc>
  <rect width="920" height="510" fill="#fffdf8"/>
  <style>
  .stage { fill: #ffffff; stroke: #c8d6d1; stroke-width: 1.5; }
  .input-stage { fill: #f2faf8; }
  .output-stage { fill: #f1f8f2; }
  .stage-label { fill: #063b35; font-size: 15px; font-weight: 500; letter-spacing: .5px; }
  .item-label { fill: #063b35; font-size: 14px; font-weight: 500; }
  .item-detail { fill: #536b67; font-size: 12px; font-weight: 400; }
  .divider { stroke: #c8d6d1; stroke-width: 1; }
  .flow-line { fill: none; stroke: #008b87; stroke-width: 2.5; }
  .tree-dot { fill: #e86f2a; }
  .context-line { fill: none; stroke: #536b67; stroke-width: 2; }
  .equity-cell { fill: #dff1ed; stroke: #008b87; stroke-width: 1; }
  .process-mark { fill: #dff1ed; stroke: #008b87; stroke-width: 1.5; }
  .check { fill: none; stroke: #008b87; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .table-line { stroke: #536b67; stroke-width: 1.4; }
</style>
  <text x="20" y="36" fill="#063b35" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="500">From source data to an analysis-ready inventory</text>
  <g transform="translate(0 55)" font-family="Arial, Helvetica, sans-serif">
    
    <title id="workflow-svg-title">Seattle tree inventory data preparation workflow</title>
    <desc id="workflow-svg-desc">Tree inventory, infrastructure and exposure, and equity context feed into preparation steps that standardize attributes, prepare DBH values, and add simulated planning variables. The output is a traceable analysis-ready tree dataset.</desc>
    <defs>
      <marker id="workflow-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 Z" fill="#008b87"></path>
      </marker>
    </defs>

    <rect class="stage input-stage" x="10" y="35" width="270" height="380" rx="8"></rect>
    <rect class="stage" x="325" y="35" width="270" height="380" rx="8"></rect>
    <rect class="stage output-stage" x="640" y="35" width="270" height="380" rx="8"></rect>

    <text class="stage-label" x="32" y="70">SOURCE DATA</text>
    <text class="stage-label" x="347" y="70">PREPARATION</text>
    <text class="stage-label" x="662" y="70">PREPARED OUTPUT</text>

    <line class="divider" x1="32" y1="88" x2="258" y2="88"></line>
    <line class="divider" x1="347" y1="88" x2="573" y2="88"></line>
    <line class="divider" x1="662" y1="88" x2="888" y2="88"></line>

    <g aria-label="Tree inventory">
      <circle class="tree-dot" cx="51" cy="129" r="7"></circle>
      <circle class="tree-dot" cx="69" cy="116" r="5"></circle>
      <circle class="tree-dot" cx="71" cy="143" r="4"></circle>
      <text class="item-label" x="91" y="126">Tree inventory</text>
      <text class="item-detail" x="91" y="147">Location, species, site, DBH</text>
    </g>

    <g aria-label="Infrastructure and exposure context">
      <path class="context-line" d="M39 221 C52 197, 64 238, 82 210"></path>
      <path class="context-line" d="M43 198 L78 239"></path>
      <text class="item-label" x="91" y="207">Infrastructure context</text>
      <text class="item-detail" x="91" y="228">Streets, sidewalks, trails, water</text>
    </g>

    <g aria-label="Racial and Social Equity Index">
      <rect class="equity-cell" x="40" y="284" width="18" height="18"></rect>
      <rect class="equity-cell" x="61" y="284" width="18" height="18"></rect>
      <rect class="equity-cell" x="40" y="305" width="18" height="18"></rect>
      <rect class="equity-cell" x="61" y="305" width="18" height="18"></rect>
      <text class="item-label" x="91" y="298">Equity context</text>
      <text class="item-detail" x="91" y="319">Racial and Social Equity Index</text>
    </g>

    <path class="flow-line" d="M280 225 L325 225" marker-end="url(#workflow-arrow)"></path>
    <path class="flow-line" d="M595 225 L640 225" marker-end="url(#workflow-arrow)"></path>

    <g aria-label="Standardize attributes">
      <circle class="process-mark" cx="366" cy="128" r="17"></circle>
      <path class="check" d="M357 128 L364 135 L376 120"></path>
      <text class="item-label" x="398" y="125">Standardize attributes</text>
      <text class="item-detail" x="398" y="146">Consistent fields and formats</text>
    </g>

    <g aria-label="Prepare DBH values">
      <circle class="process-mark" cx="366" cy="220" r="17"></circle>
      <text class="item-label" x="359" y="225">DBH</text>
      <text class="item-label" x="398" y="207">Prepare DBH values</text>
      <text class="item-detail" x="398" y="228">Preserve, clean, impute, flag</text>
    </g>

    <g aria-label="Add modeled planning fields">
      <circle class="process-mark" cx="366" cy="312" r="17"></circle>
      <path class="check" d="M357 312 L364 319 L376 304"></path>
      <text class="item-label" x="398" y="299">Add planning variables</text>
      <text class="item-detail" x="398" y="320">Simulated condition and history</text>
    </g>

    <g aria-label="Analysis-ready tree asset dataset">
      <rect class="process-mark" x="683" y="121" width="184" height="132" rx="4"></rect>
      <line class="table-line" x1="683" y1="154" x2="867" y2="154"></line>
      <line class="table-line" x1="683" y1="187" x2="867" y2="187"></line>
      <line class="table-line" x1="683" y1="220" x2="867" y2="220"></line>
      <line class="table-line" x1="729" y1="121" x2="729" y2="253"></line>
      <circle class="tree-dot" cx="706" cy="137" r="5"></circle>
      <circle class="tree-dot" cx="706" cy="170" r="5"></circle>
      <circle class="tree-dot" cx="706" cy="203" r="5"></circle>
      <circle class="tree-dot" cx="706" cy="236" r="5"></circle>
      <text class="item-label" x="681" y="295">Analysis-ready tree assets</text>
      <text class="item-detail" x="681" y="321">Original and derived fields retained</text>
      <text class="item-detail" x="681" y="343">Preparation method documented</text>
      <text class="item-detail" x="681" y="365">Ready for priority scoring</text>
    </g>
  
  </g>
</svg>
