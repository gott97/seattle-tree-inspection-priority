<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <style>
      .title{font:700 42px 'DejaVu Sans',sans-serif;fill:#003b3a}.subtitle{font:400 21px 'DejaVu Sans',sans-serif;fill:#526a69}
      .step{font:700 24px 'DejaVu Sans',sans-serif;fill:#003b3a}.body{font:400 18px 'DejaVu Sans',sans-serif;fill:#526a69}
      .num{font:700 22px 'DejaVu Sans',sans-serif;fill:#fff}.score{font:700 45px 'DejaVu Sans',sans-serif;fill:#e96b2c}
      .band{font:700 17px 'DejaVu Sans',sans-serif;fill:white}.band-threshold{font:400 17px 'DejaVu Sans',sans-serif;fill:white}.small{font:600 16px 'DejaVu Sans',sans-serif;fill:#294847}
      .card{fill:white;stroke:#cadbd8;stroke-width:2}.arrow{fill:none;stroke:#078d89;stroke-width:5}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#173e3c" flood-opacity=".12"/></filter>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#078d89"/></marker>
  </defs>
  <rect width="1600" height="760" fill="#fbfaf6"/>
  <text x="80" y="80" class="title">From prepared data to a Year 1 inspection program</text>
  <text x="80" y="118" class="subtitle">The model preserves a continuous score, simplifies it for communication, and ranks assets for program selection.</text>

  <path d="M345 340 H405" class="arrow" marker-end="url(#arrowhead)"/><path d="M700 340 H760" class="arrow" marker-end="url(#arrowhead)"/><path d="M1055 340 H1115" class="arrow" marker-end="url(#arrowhead)"/>

  <g><rect x="60" y="205" width="285" height="310" rx="24" class="card"/><rect x="415" y="205" width="285" height="310" rx="24" class="card"/><rect x="770" y="205" width="285" height="310" rx="24" class="card"/><rect x="1125" y="205" width="415" height="310" rx="24" class="card"/></g>
  <circle cx="105" cy="250" r="25" fill="#078d89"/><text x="105" y="258" text-anchor="middle" class="num">1</text>
  <text x="90" y="295" class="step">Prepared</text><text x="90" y="325" class="step">inventory</text>
  <text x="90" y="360" class="body">Cleaned asset fields</text><text x="90" y="390" class="body">Spatial indicators</text><text x="90" y="420" class="body">Modeled planning</text><text x="90" y="447" class="body">variables</text>
  <g transform="translate(90 458)" fill="none" stroke="#078d89" stroke-width="3"><rect x="0" y="0" width="115" height="40" rx="5"/><line x1="0" y1="14" x2="115" y2="14"/><line x1="30" y1="0" x2="30" y2="40"/><circle cx="15" cy="23" r="4" fill="#e96b2c" stroke="none"/><circle cx="15" cy="34" r="4" fill="#e96b2c" stroke="none"/></g>

  <circle cx="460" cy="250" r="25" fill="#078d89"/><text x="460" y="258" text-anchor="middle" class="num">2</text>
  <text x="445" y="295" class="step">Weighted scoring</text>
  <text x="445" y="353" class="body">Nine criteria</text><text x="445" y="383" class="body">Documented weights</text><text x="445" y="413" class="body">Common 0–100 scale</text>
  <rect x="445" y="455" width="220" height="18" rx="9" fill="#e8f1ef"/><rect x="445" y="455" width="128" height="18" rx="9" fill="#e96b2c"/>
  <rect x="445" y="484" width="220" height="18" rx="9" fill="#e8f1ef"/><rect x="445" y="484" width="53" height="18" rx="9" fill="#dcae48"/>

  <circle cx="815" cy="250" r="25" fill="#078d89"/><text x="815" y="258" text-anchor="middle" class="num">3</text>
  <text x="800" y="295" class="step">Priority index</text>
  <text x="800" y="382" class="score">0–100</text>
  <text x="800" y="415" class="body">Continuous score preserves</text><text x="800" y="442" class="body">fine differences between</text><text x="800" y="469" class="body">individual assets.</text>
  <rect x="800" y="488" width="225" height="12" rx="6" fill="url(#scoreGradient)"/>
  <defs><linearGradient id="scoreGradient"><stop offset="0" stop-color="#e9eee9"/><stop offset=".45" stop-color="#dcae48"/><stop offset="1" stop-color="#be5631"/></linearGradient></defs>

  <circle cx="1170" cy="250" r="25" fill="#078d89"/><text x="1170" y="258" text-anchor="middle" class="num">4</text>
  <text x="1155" y="295" class="step">Operational use</text>
  <text x="1155" y="350" class="small">Priority classes</text>
  <rect x="1155" y="360" width="330" height="34" rx="7" fill="#be5631"/><text x="1170" y="383" class="band">CRITICAL</text><text x="1270" y="383" class="band-threshold">75–100</text>
  <rect x="1155" y="399" width="330" height="34" rx="7" fill="#e96b2c"/><text x="1170" y="422" class="band">HIGH</text><text x="1230" y="422" class="band-threshold">55–74</text>
  <rect x="1155" y="438" width="330" height="34" rx="7" fill="#dcae48"/><text x="1170" y="461" class="band">MODERATE</text><text x="1280" y="461" class="band-threshold">35–54</text>
  <rect x="1155" y="477" width="330" height="34" rx="7" fill="#8baaa6"/><text x="1170" y="500" class="band">LOW</text><text x="1220" y="500" class="band-threshold">&lt;35</text>

  <path d="M1332 555 V610" class="arrow" marker-end="url(#arrowhead)"/>
  <rect x="1085" y="625" width="495" height="78" rx="18" fill="#e4f2ef" stroke="#078d89" stroke-width="2"/>
  <text x="1332" y="658" text-anchor="middle" class="step">Rank all 20,992 assets</text>
  <text x="1332" y="685" text-anchor="middle" class="body">Select the top 5%: 1,050 Year 1 candidates</text>

  <text x="80" y="665" class="body">Classes support readable maps and summaries.</text><text x="80" y="696" class="body">The underlying score remains available for ranking within them.</text>
</svg>
